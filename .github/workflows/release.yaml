# Publishes both charts as OCI artifacts under oci://ghcr.io/bsure-analytics/charts, a
# charts/ prefix so chart names cannot collide with container images in the same GHCR
# namespace. Triggered by pushing a semver tag (git tag v0.12.0 && git push origin
# v0.12.0). Chart.yaml is the source of truth for the version: the tag has to match it,
# and nothing is published unless it does.
---
jobs:
  publish:
    # ubuntu-latest rather than the org's self-hosted runners: this repository is public,
    # and runner groups do not serve public repositories by default.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Verify the chart versions match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for chart in charts/druid charts/druid-dev; do
            declared="$(helm show chart "$chart" | awk '/^version:/ {print $2}')"
            if [ "$declared" != "$version" ]; then
              echo "::error::$chart declares version $declared, but the tag says $version"
              exit 1
            fi
            echo "OK: $chart -> $declared"
          done
      - name: Add chart repositories
        # helm dependency build resolves the committed Chart.lock against the runner's
        # local Helm repo config rather than fetching each dependency's URL directly --
        # that is what helm dependency update does. A fresh runner starts with none
        # registered, so charts/druid-dev's three unique HTTP(S) subchart repositories
        # need adding before the build step below can resolve them.
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add deepbi https://charts.deep.bi
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server
      - name: Lint and package
        # dependency build, not update: the committed Chart.lock decides which subchart
        # versions druid-dev bundles, and it fails if Chart.yaml and the lock disagree --
        # i.e. if the release commit skipped make dependency-update.
        run: |
          helm lint charts/druid
          helm dependency build charts/druid-dev
          helm lint charts/druid-dev
          helm package charts/druid --destination dist/
          helm package charts/druid-dev --destination dist/
      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
      - name: Push
        run: |
          for package in dist/*.tgz; do
            helm push "$package" oci://ghcr.io/bsure-analytics/charts
          done
name: Release
on:
  push:
    tags: [ 'v*.*.*' ]
permissions:
  contents: read
  packages: write # push the OCI artifacts to ghcr.io
